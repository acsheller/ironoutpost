apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: missions.ironoutpost.dev
spec:
  group: ironoutpost.dev
  scope: Namespaced
  names:
    plural: missions
    singular: mission
    kind: Mission
    shortNames:
      - msn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: Mission represents an operational task.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - objective
              properties:
                objective:
                  type: string
                  minLength: 1
                  description: Mission objective or task summary.
                outpostRef:
                  type: string
                  description: Name of the Outpost assigned to the mission.
                virtualChannelRefs:
                  type: array
                  description: VirtualChannels used by this mission.
                  items:
                    type: string
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                    - critical
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                health:
                  type: string
                message:
                  type: string
