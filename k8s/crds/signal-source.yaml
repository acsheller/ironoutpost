apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: signalsources.ironoutpost.dev
spec:
  group: ironoutpost.dev
  scope: Namespaced
  names:
    plural: signalsources
    singular: signalsource
    kind: SignalSource
    shortNames:
      - ss
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: SignalSource represents a wideband input or source.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - outpostRef
                - centerFrequencyHz
                - bandwidthHz
                - sampleRateSps
              properties:
                outpostRef:
                  type: string
                  minLength: 1
                  description: Name of the Outpost hosting this source.
                sourceType:
                  type: string
                  description: Type of source, such as antenna, file, or network.
                centerFrequencyHz:
                  type: integer
                  format: int64
                  minimum: 0
                bandwidthHz:
                  type: integer
                  format: int64
                  minimum: 1
                sampleRateSps:
                  type: integer
                  format: int64
                  minimum: 1
                endpoint:
                  type: string
                  description: Optional source endpoint or device path.
            status:
              type: object
              properties:
                phase:
                  type: string
                health:
                  type: string
                message:
                  type: string
